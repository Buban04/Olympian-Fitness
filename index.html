<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Olympian Fitness</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<header class="tituloindex">
  <h1><a href="#inicio">OLYMPIAN <span class="fitness">FITNESS</span></a></h1>
  <nav id="nav"></nav>
</header>

<main id="app"></main>

<footer>
  <h3>OLYMPIAN FITNESS</h3>
  <p>Dirección: Calle 10 #20-30</p>
  <p>Teléfono: 300 000 0000</p>
  <p>Correo: contacto@olympianfitness.com</p>
</footer>

<script type="module">
import { supabase, getProfile, signOut } from './supabase-client.js';

const app = document.querySelector('#app');
const nav = document.querySelector('#nav');

const escapeHtml = (s='') => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));

async function renderNav() {
  const profile = await getProfile();
  nav.innerHTML = `
    <a href="#horarios">Horarios</a>
    <a href="#entrenadores">Entrenadores</a>
    <a href="#foro">Foro/comunidad</a>
    <a href="#planes">Planes</a>
    ${profile
      ? `<a href="#panel">Mi panel</a><a href="#" id="logout">Salir</a>`
      : `<a href="#login" class="login-btn"><img src="usuario.png" alt="login"></a>`}
  `;
  document.querySelector('#logout')?.addEventListener('click', async e => {
    e.preventDefault(); await signOut();
  });
}

async function home() {
  app.innerHTML = `
  <section class="inicio">
    <div class="contenido">
      <h2>BIENVENIDO A OLYMPIAN FITNESS</h2>
      <p>Mejora tu salud y transforma tu cuerpo con nuestros entrenamientos personalizados.</p>
      <button onclick="location.hash='#planes'">¡VER PLANES!</button>
    </div>
  </section>
  <section class="servicios">
    <h2>Servicios Destacados</h2>
    <div class="contenedor-cards">
      <div class="card"><div class="icono">🏋️</div><h3>Rutinas</h3><p>Planes de entrenamiento personalizados.</p></div>
      <div class="card"><div class="icono">🥇</div><h3>Membresías</h3><p>Escoge el mejor plan para ti.</p></div>
      <div class="card"><div class="icono">👨‍💼</div><h3>Entrenadores</h3><p>Profesionales certificados.</p></div>
      <div class="card"><div class="icono">💬</div><h3>Comunidad</h3><p>Consejos fitness y apoyo.</p></div>
    </div>
  </section>`;
}

async function login() {
  app.innerHTML = `<section class="formulario"><div class="caja-formulario">
    <h2>Iniciar sesión</h2>
    <form id="login-form">
      <label>Correo</label><input type="email" name="correo" required>
      <label>Contraseña</label><input type="password" name="password" required>
      <button>Entrar</button>
    </form>
    <a class="boton-link" href="#registro">Crear cuenta</a>
    <p id="msg"></p>
  </div></section>`;
  document.querySelector('#login-form').addEventListener('submit', async e => {
    e.preventDefault();
    const f = new FormData(e.target);
    const { error } = await supabase.auth.signInWithPassword({
      email: f.get('correo'), password: f.get('password')
    });
    document.querySelector('#msg').textContent = error ? error.message : 'Acceso correcto';
    if (!error) location.hash = '#panel';
  });
}

async function registro() {
  app.innerHTML = `<section class="formulario"><div class="caja-formulario">
    <h2>Crear cuenta</h2>
    <form id="reg-form">
      <label>Nombre completo</label><input name="nombre" required>
      <label>Correo</label><input type="email" name="correo" required>
      <label>Teléfono</label><input name="telefono">
      <label>Contraseña</label><input type="password" name="password" minlength="6" required>
      <button>Registrarme</button>
    </form><p id="msg"></p>
  </div></section>`;
  document.querySelector('#reg-form').addEventListener('submit', async e => {
    e.preventDefault();
    const f = new FormData(e.target);
    const { error } = await supabase.auth.signUp({
      email: f.get('correo'), password: f.get('password'),
      options: { data: { nombre_completo: f.get('nombre'), telefono: f.get('telefono') } }
    });
    document.querySelector('#msg').textContent = error
      ? error.message
      : 'Cuenta creada. Si activaste confirmación de correo, revisa tu email.';
  });
}

async function plans() {
  const { data, error } = await supabase.from('planes').select('*').order('id');
  if (error) return app.innerHTML = `<p>${escapeHtml(error.message)}</p>`;
  app.innerHTML = `<section class="servicios"><h2>Planes</h2><div class="contenedor-cards">
    ${data.map(p => `<div class="card">
      <h3>${escapeHtml(p.nombre)}</h3><h2>$${Number(p.precio).toLocaleString('es-CO')}</h2>
      <p>${escapeHtml(p.beneficios).replaceAll('\n','<br>')}</p>
      <button data-plan="${p.id}">Elegir plan</button>
    </div>`).join('')}
  </div><p id="plan-msg"></p></section>`;
  document.querySelectorAll('[data-plan]').forEach(b => b.onclick = async () => {
    const profile = await getProfile();
    if (!profile) return location.hash = '#login';
    const planId = Number(b.dataset.plan);
    const now = new Date();
    const end = new Date(now); end.setMonth(end.getMonth()+1);
    const { error } = await supabase.from('membresias').insert({
      usuario_id: profile.id, plan_id: planId,
      fecha_inicio: now.toISOString().slice(0,10),
      fecha_fin: end.toISOString().slice(0,10),
      estado: 'activa', metodo_pago: 'pendiente'
    });
    document.querySelector('#plan-msg').textContent = error
      ? error.message : 'Plan seleccionado. Falta integrar el proveedor de pago real.';
  });
}

async function schedules() {
  const { data, error } = await supabase.from('horario_gimnasio').select('*').order('id');
  app.innerHTML = `<section class="servicios"><h2>Horarios</h2><div class="contenedor-cards">
    ${(data||[]).map(x => `<div class="card"><h3>${escapeHtml(x.dias)}</h3><p>${x.apertura.slice(0,5)} — ${x.cierre.slice(0,5)}</p><p>${escapeHtml(x.telefono||'')}</p></div>`).join('')}
  </div>${error?`<p>${escapeHtml(error.message)}</p>`:''}</section>`;
}

async function trainers() {
  const { data, error } = await supabase.from('entrenadores').select('id,especialidad,descripcion,usuarios(nombre_completo,correo)');
  app.innerHTML = `<section class="servicios"><h2>Entrenadores</h2><div class="contenedor-cards">
    ${(data||[]).map(x => `<div class="card"><div class="icono">🏋️</div><h3>${escapeHtml(x.usuarios?.nombre_completo||'Entrenador')}</h3><p>${escapeHtml(x.especialidad)}</p><p>${escapeHtml(x.descripcion||'')}</p></div>`).join('')}
  </div>${error?`<p>${escapeHtml(error.message)}</p>`:''}</section>`;
}

async function forum() {
  const { data, error } = await supabase.from('foro_temas').select('id,titulo,contenido,fecha_creacion,usuarios(nombre_completo)').order('fecha_creacion',{ascending:false});
  const profile = await getProfile();
  app.innerHTML = `<section class="servicios"><h2>Foro</h2>
    ${profile?`<form id="topic-form" class="caja-formulario" style="margin:auto;max-width:650px">
      <input name="titulo" placeholder="Título" required><textarea name="contenido" placeholder="Escribe..." required style="min-height:120px"></textarea>
      <button>Publicar</button></form>`:''}
    <div class="contenedor-cards">
    ${(data||[]).map(t=>`<div class="card"><h3>${escapeHtml(t.titulo)}</h3><p>${escapeHtml(t.contenido)}</p><small>Por ${escapeHtml(t.usuarios?.nombre_completo||'usuario')}</small></div>`).join('')}
    </div>${error?`<p>${escapeHtml(error.message)}</p>`:''}</section>`;
  document.querySelector('#topic-form')?.addEventListener('submit', async e => {
    e.preventDefault();
    const f = new FormData(e.target);
    const p = await getProfile();
    const {error} = await supabase.from('foro_temas').insert({usuario_id:p.id,titulo:f.get('titulo'),contenido:f.get('contenido')});
    if(error) alert(error.message); else forum();
  });
}

async function routines() {
  const p = await getProfile();
  if (!p) return location.hash='#login';
  const { data, error } = await supabase.from('rutinas').select('*,entrenadores(especialidad,usuarios(nombre_completo)),rutina_ejercicios(*)').eq('usuario_id',p.id).order('id');
  app.innerHTML = `<section class="servicios"><h2>Mis rutinas</h2><div class="contenedor-cards">
    ${(data||[]).map(r=>`<div class="card"><h3>${escapeHtml(r.nombre)}</h3><p>${escapeHtml(r.descripcion||'')}</p>
      <p>Duración: ${r.duracion_min||'—'} min</p>
      <hr>${(r.rutina_ejercicios||[]).sort((a,b)=>a.orden-b.orden).map(e=>`<p><b>${escapeHtml(e.dia)}</b>: ${escapeHtml(e.ejercicio)} — ${e.series||'—'} series × ${escapeHtml(e.repeticiones||'—')}</p>`).join('')}
    </div>`).join('')}
  </div>${error?`<p>${escapeHtml(error.message)}</p>`:''}</section>`;
}

async function panel() {
  const p = await getProfile();
  if (!p) return location.hash='#login';
  const { data: memberships } = await supabase.from('membresias').select('*,planes(nombre,precio)').eq('usuario_id',p.id).order('id',{ascending:false});
  app.innerHTML = `<section class="servicios"><h2>Mi panel</h2>
    <div class="card" style="margin:auto;max-width:600px"><h3>👤 ${escapeHtml(p.nombre_completo)}</h3><p>${escapeHtml(p.correo)}</p><p>Rol: ${escapeHtml(p.rol)}</p></div>
    <div class="contenedor-cards">
      <div class="card"><h3>Rutinas</h3><p><a href="#rutinas">Ver mis rutinas</a></p></div>
      <div class="card"><h3>Membresías</h3>${(memberships||[]).map(m=>`<p>${escapeHtml(m.planes?.nombre||'Plan')} — ${m.estado}</p>`).join('')||'<p>No tienes membresías.</p>'}</div>
    </div>
  </section>`;
}

async function router() {
  await renderNav();
  const route = location.hash.slice(1) || 'inicio';
  if(route==='inicio') return home();
  if(route==='login') return login();
  if(route==='registro') return registro();
  if(route==='planes') return plans();
  if(route==='horarios') return schedules();
  if(route==='entrenadores') return trainers();
  if(route==='foro') return forum();
  if(route==='rutinas') return routines();
  if(route==='panel') return panel();
  home();
}
window.addEventListener('hashchange', router);
router();
</script>
</body>
</html>
