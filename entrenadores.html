<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Entrenadores - Olympian Fitness</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="entrenadoress">

<header class="tituloindex" id="site-header"></header>

<section class="servicios">
  <div class="entrenadores-intro">
    <span class="horarios-eyebrow">OLYMPIAN FITNESS</span>
    <h2>Nuestros entrenadores</h2>
    <p class="entrenadores-sub">Profesionales listos para ayudarte a alcanzar tu meta</p>
  </div>
  <div class="contenedor-cards" id="lista-entrenadores">
    <p class="cargando">Cargando entrenadores...</p>
  </div>
</section>

<footer>
  <h3>OLYMPIAN FITNESS</h3>
  <p>Dirección: Calle 10 #20-30</p>
  <p>Teléfono: 300 000 0000</p>
  <p>Correo: contacto@olympianfitness.com</p>
</footer>

<div id="site-fab"></div>

<script type="module">
import { supabase, renderHeader, escapeHtml, getProfile } from './app.js';
const profile = await renderHeader('entrenadores.html');

const telefonoGimnasio = "573205000000"; // ajusta al número real

// Revisa si el usuario tiene el plan Premium (id 2) activo
async function tienePremium(usuarioId) {
  const { data, error } = await supabase
    .from('membresias')
    .select('id')
    .eq('usuario_id', usuarioId)
    .eq('plan_id', 2)
    .eq('estado', 'activa')
    .limit(1);
  if (error) { console.error(error); return false; }
  return data && data.length > 0;
}

const esPremium = profile ? await tienePremium(profile.id) : false;

function botonReservar(nombreEntrenador) {
  if (!profile) {
    return `<a class="btn-reservar login" href="login.html">Inicia sesión para reservar</a>`;
  }
  if (!esPremium) {
    return `<a class="btn-reservar bloqueado" href="planes.html" title="Disponible solo con el plan Premium">Solo para plan Premium</a>`;
  }
  const mensaje = encodeURIComponent(`Hola, quiero reservar con el entrenador ${nombreEntrenador}`);
  return `<a class="btn-reservar activo" href="https://wa.me/${telefonoGimnasio}?text=${mensaje}" target="_blank">Escoger entrenador</a>`;
}

const cont = document.querySelector('#lista-entrenadores');
const { data, error } = await supabase
  .from('entrenadores')
  .select('id,especialidad,descripcion,usuarios(nombre_completo)');

function iniciales(nombre) {
  if (!nombre) return 'E';
  const partes = nombre.trim().split(' ');
  return (partes[0][0] + (partes[1]?.[0] || '')).toUpperCase();
}

if (error) {
  cont.innerHTML = `<p class="vacio">${escapeHtml(error.message)}</p>`;
} else if (!data || data.length === 0) {
  cont.innerHTML = `<p class="vacio">Todavía no hay entrenadores registrados.</p>`;
} else {
  cont.innerHTML = data.map(x => {
    const nombre = x.usuarios?.nombre_completo || 'Entrenador';
    return `
    <div class="card">
      <div class="avatar-entrenador">${iniciales(nombre)}</div>
      <h3>${escapeHtml(nombre)}</h3>
      <span class="badge-especialidad">${escapeHtml(x.especialidad)}</span>
      ${x.descripcion ? `<p class="descripcion">${escapeHtml(x.descripcion)}</p>` : ''}
      ${botonReservar(escapeHtml(nombre))}
    </div>`;
  }).join('');
}
</script>
</body>
</html>
